<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">

<title>Plano de Corrida Personalizado</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--pri:#1a252f;--acc:#d35400;--ok:#27ae60;--red:#c0392b}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:#333;margin:0;padding:16px;display:flex;justify-content:center}
.container{max-width:700px;width:100%;background:var(--card);padding:24px;border-radius:12px;box-shadow:0 8px 16px rgba(0,0,0,.1)}
h1{text-align:center;color:var(--pri);margin:0 0 16px;font-size:22px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
select,input,button{font:inherit}
select,input{padding:8px;border-radius:6px;border:1px solid #ccc;background:#fff;min-width:0}
.progress{font-weight:bold;color:var(--acc)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid #eee}
.btn{background:#e8edf1;border:none;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--pri);font-weight:600}
.btn.pri{background:var(--pri);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fdecea;color:var(--red)}
.card{background:#f9f9f9;border-left:5px solid var(--pri);padding:14px 16px;margin-bottom:12px;border-radius:6px;display:flex;gap:10px;flex-wrap:wrap}
.card.completed{border-left-color:var(--ok);background:#f0fdf4}
.card input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);margin-top:2px}
.det{flex:1;min-width:180px}.det h3{margin:0 0 6px;font-size:17px;color:var(--pri)}
.det p{margin:0 0 8px;font-size:14px;line-height:1.5;color:#444}
.completed .det h3,.completed .det p{text-decoration:line-through;color:#888}
.tag{display:inline-block;background:#eee;padding:2px 8px;border-radius:4px;font-size:12px;color:#666;font-weight:bold}
.acts{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.empty{text-align:center;color:#777;padding:30px 10px;border:2px dashed #ddd;border-radius:8px}
/* modais */
.modal{display:none;position:fixed;inset:0;z-index:9999}.modal.active{display:flex}
#editor{background:rgba(0,0,0,.5);align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.sheet{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:760px}
.sheet h2{margin:0 0 12px;font-size:19px;color:var(--pri)}
.sheet label{font-size:12px;color:#666;display:block;margin-bottom:2px}
.sheet .f{width:100%;margin-bottom:10px}
.step{border:1px solid #e1e6ea;border-radius:8px;padding:8px;margin-bottom:8px;background:#fafbfc}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
.row>div{display:flex;flex-direction:column}
.n{width:62px}.v{width:90px}
.gen{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px;margin:10px 0}
.gen b{font-size:13px}
#playerModal{background:#090d16;flex-direction:column;justify-content:space-between;padding:20px;text-align:center;color:#f8fafc}
.ph{display:flex;justify-content:space-between;align-items:center}
.btn-close{background:#334155;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:bold;text-transform:uppercase}
.bg-walk{background:#1e3a8a;color:#93c5fd}.bg-run{background:#831843;color:#fbcfe8}.bg-cool{background:#064e3b;color:#a7f3d0}
.timer{font-size:72px;font-weight:800;font-family:monospace;margin:10px 0}
.speed{font-size:26px;font-weight:800;color:#facc15;margin-bottom:6px}
.next{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;font-size:14px;color:#cbd5e1}
.bar{background:#1e293b;height:10px;border-radius:5px;overflow:hidden;margin:16px 0}
.bar div{height:100%;background:#38bdf8;width:0}
.pc{display:flex;justify-content:center;align-items:center;gap:16px}
.circ{width:60px;height:60px;border-radius:50%;border:none;font-size:20px;cursor:pointer;background:#334155;color:#fff}
.circ.play{width:75px;height:75px;background:var(--ok);font-size:26px}
/* ---- mobile ---- */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
button,select,input,summary{touch-action:manipulation}
input,select{font-size:16px;min-height:44px}
input[type=checkbox]{min-height:0}
.card input[type=checkbox]{width:28px;height:28px}
#audioToggle{width:22px;height:22px;vertical-align:middle}
.btn{min-height:44px;padding:10px 14px;font-size:14px}
.btn.big{width:100%;min-height:54px;font-size:17px;margin-bottom:10px}
.step .btn{min-width:44px;padding:8px}
.wk{display:flex;gap:6px;flex:1}.wk select{flex:1}
.more{margin-bottom:12px}.more summary{cursor:pointer;font-weight:600;color:var(--pri);padding:12px 4px;min-height:44px}
.more .toolbar .btn{flex:1 1 45%}
.foot{justify-content:flex-end;position:sticky;bottom:0;background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid #eee;margin-top:10px}
.foot .btn{flex:1}
.btn-close{padding:12px 18px}
#playerModal{padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom))}
.timer{font-size:clamp(64px,24vw,130px)}
.circ{width:68px;height:68px}.circ.play{width:92px;height:92px}
@media (max-width:600px){
 body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:block}
 .container{border-radius:0;box-shadow:none;padding:12px;min-height:100dvh}
 h1{font-size:19px;margin-bottom:8px}
 .controls{position:sticky;top:env(safe-area-inset-top);background:#fff;z-index:5;padding:8px 0;margin:0 0 8px}
 .progress{font-size:13px;white-space:nowrap}
 .acts{width:100%;margin-left:0}.acts .btn{flex:1}.acts .btn.ok{flex:3}
 #editor{padding:0;background:#fff}.sheet{border-radius:0;min-height:100dvh;padding:14px}
}
@media (max-height:480px){.timer{font-size:20vh;margin:0}.next{display:none}.bar{margin:8px 0}.circ{width:52px;height:52px}.circ.play{width:64px;height:64px}}
/* ---- visual de app ---- */
:root{--bg:#f2f4f7;--sf:#fff;--tx:#1b2430;--mut:#6b7785;--line:#e6eaef}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--sf:#151b23;--tx:#e8edf2;--mut:#8b97a5;--line:#252e3a;--pri:#334155}.btn.danger{background:#3a1d1a}}
body{display:block;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.appbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.abi{max-width:560px;margin:0 auto}
.ab-top{display:flex;align-items:center;gap:10px;padding:6px 0}
.ab-top h1{flex:1;text-align:left;margin:0;font-size:30px;font-weight:800;color:var(--tx)}
.progress{background:var(--sf);padding:7px 12px;border-radius:99px;font-size:13px}
.icon{width:44px;height:44px;border-radius:50%;border:none;background:var(--sf);color:var(--tx);font-size:20px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:none;background:var(--sf);color:var(--mut);padding:0 16px;min-height:40px;border-radius:99px;font-weight:600;font-size:14px}
.chip.on{background:var(--acc);color:#fff}
.container{max-width:560px;margin:0 auto;width:100%;background:transparent;box-shadow:none;border-radius:0;min-height:0;padding:4px max(14px,env(safe-area-inset-right)) 120px max(14px,env(safe-area-inset-left))}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--sf);border:0;border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);animation:fi .25s ease both;transition:transform .12s}
.card:active{transform:scale(.985)}
.card.completed{background:var(--sf);opacity:.65}
.det{cursor:pointer;min-width:0}
.det h3{color:var(--tx);font-size:17px}
.det p{color:var(--mut)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--bg);color:var(--mut);border-radius:99px;padding:3px 10px}
.ck{position:relative;display:block;width:30px;height:30px}
.card .ck input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0}
.ck span{display:block;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);text-align:center;line-height:26px;color:#fff;font-weight:800}
.ck input:checked+span{background:var(--ok);border-color:var(--ok)}
.ck input:checked+span::after{content:'✓'}
.play{width:56px;height:56px;border-radius:50%;border:none;background:var(--ok);color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(39,174,96,.4)}
.play:active,.fab:active,.btn:active,.chip:active{transform:scale(.92)}
.tl{grid-column:1/-1;display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden}
.tl i{display:block;min-width:2px}.t-run{background:var(--run)}.t-walk{background:var(--walk)}.t-cool{background:var(--cool)}
.empty{color:var(--mut);border-color:var(--line);margin-top:20px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:34px;line-height:1;box-shadow:0 6px 18px rgba(211,84,0,.45);z-index:30}
#menu{background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.bsheet{background:var(--sf);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:8px 16px calc(12px + env(safe-area-inset-bottom));animation:up .25s ease}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 8px}
.mi{display:flex;width:100%;align-items:center;gap:12px;min-height:54px;border:0;border-bottom:1px solid var(--line);background:none;font-size:16px;color:var(--tx);text-align:left}
.mi.d{color:var(--red)}.mi:last-of-type{border-bottom:0}
@keyframes up{from{transform:translateY(100%)}}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.sheet{background:var(--sf);color:var(--tx);animation:up .28s ease}
.sheet h2{color:var(--tx)}.sheet label{color:var(--mut)}
.eh{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--sf);padding:4px 0 10px;z-index:3}
.eh h2{flex:1;margin:0;font-size:18px;text-align:center}
.eh .icon{background:var(--bg)}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px}
.btn{background:var(--line);color:var(--tx);border-radius:10px}
.step{background:var(--bg);border-color:var(--line)}
.gen{background:var(--bg);border:1px dashed var(--line)}
.foot{background:var(--sf);border-color:var(--line)}
@media (max-width:600px){#editor{background:var(--sf)}}
#playerModal{transition:background .4s}
#playerModal[data-t=run]{background:#1a0713}#playerModal[data-t=walk]{background:#08122b}#playerModal[data-t=cool]{background:#06201a}
.ringwrap{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:0 auto}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.r0{stroke:#1e293b}
.r1{stroke:var(--walk);stroke-linecap:round;stroke-dasharray:565.5;stroke-dashoffset:565.5;transition:stroke-dashoffset .3s linear,stroke .4s}
[data-t=run] .r1{stroke:var(--run)}[data-t=cool] .r1{stroke:var(--cool)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14%}
.timer{margin:0;font-size:clamp(44px,15vw,80px)}
.speed{font-size:clamp(13px,4vw,19px);line-height:1.25;margin-top:6px}
@media (max-height:480px){.ringwrap{width:min(56vh,220px)}.timer{font-size:11vh}}
/* ---- editor v2 ---- */
.eh{display:block;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:8px}
.eh1{display:flex;align-items:center;gap:8px}
.tl.big{height:10px;border-radius:5px;margin-top:8px}
.sumtxt{font-size:13px;color:var(--mut);margin-top:6px}
.sheet .big-in{font-size:20px;font-weight:700}
.unit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;font-size:14px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);border-radius:9px;min-height:40px;font-size:13px;font-weight:600}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sc .seg{background:var(--sf)}
.seg button.on.run{background:var(--run);color:#fff}.seg button.on.walk{background:var(--walk);color:#fff}.seg button.on.cool{background:var(--cool);color:#fff}
.sc{background:var(--bg);border-radius:14px;padding:10px;margin-bottom:10px;border-left:5px solid var(--walk)}
.sc-run{border-left-color:var(--run)}.sc-cool{border-left-color:var(--cool)}
.sc-h{display:flex;gap:4px;align-items:center;margin-bottom:8px}
.sc .sn{flex:1;min-width:0;font-weight:700;font-size:15px;background:var(--sf)}
.ib{display:flex;flex:none}.ib button{width:34px;height:40px;border:0;background:none;color:var(--mut);font-size:16px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cg label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.stp{display:flex;align-items:center;background:var(--sf);border-radius:12px;border:1px solid var(--line)}
.stp button{flex:none;width:40px;height:44px;border:0;background:none;color:var(--acc);font-size:22px;font-weight:700}
.stp input{flex:1;min-width:0;width:100%;text-align:center;border:0;background:none;font-size:17px;font-weight:700;padding:0}
.cg small{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:3px;min-height:15px}
.rep{border:2px solid var(--acc);border-radius:16px;padding:10px;margin-bottom:12px}
.rep-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}.rep-h b{flex:1;font-size:15px}
.stp.sm{width:130px}.stp.sm span{flex:1;text-align:center;font-weight:800}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
/* ---- player: destaque do ritmo e da próxima etapa ---- */
.speed{font-size:clamp(26px,8.5vw,40px);font-weight:900;line-height:1.05;margin-top:6px}
.speed small{display:block;font-size:.45em;font-weight:700;color:#fde68a;margin-top:3px}
.next{transition:background .25s,padding .25s}
.nl{font-size:11px;color:#94a3b8;margin-bottom:4px}
.nn{font-weight:700}.ns{font-size:15px;color:#cbd5e1;margin-top:2px}.ns small{font-size:.8em;font-weight:600}
.next.alert{color:#fff;border-color:transparent;padding:18px 12px;animation:pulse .9s ease-in-out infinite}
.next[data-n=run].alert{background:#db2777}.next[data-n=walk].alert{background:#2563eb}.next[data-n=cool].alert{background:#059669}
.next.alert .nl{color:rgba(255,255,255,.85);font-size:13px;font-weight:800;letter-spacing:.5px}
.next.alert .nn{font-size:20px}
.next.alert .ns{color:#fff;font-size:clamp(34px,11vw,54px);font-weight:900;line-height:1.05}
.next.alert .ns small{display:block;font-size:.4em;color:rgba(255,255,255,.9)}
@keyframes pulse{50%{transform:scale(1.04)}}
.ringwrap{transition:width .25s}
#playerModal.al .ringwrap{width:min(56vw,220px)}
#playerModal.al .timer{font-size:clamp(34px,11vw,56px)}
#playerModal.al .speed{font-size:clamp(16px,5vw,24px)}
#playerModal.al .bar{display:none}
@media (max-height:480px){.speed{font-size:6vh}.next.alert .ns{font-size:9vh}#playerModal.al .ringwrap{width:min(56vh,220px)}#playerModal.al .timer{font-size:11vh}}
/* ---- semanas concluídas / toast ---- */
#doneM{background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#doneList{max-height:55vh;overflow:auto}
.bsheet h3{margin:4px 0 6px;font-size:17px}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sf);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1f2937;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;width:max-content;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:.25s;z-index:9990;display:flex;gap:12px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#fbbf24;font-weight:800;font-size:14px;min-height:36px}
/* Novas cores e áreas */
:root{--acc:#d35400;--ok:#27ae60;--red:#c0392b;--run:var(--acc);--walk:#60a5fa;--cool:#34d399}
html[data-theme="oceano"]{--acc:#0284c7;--ok:#0d9488;--run:#0284c7}html[data-theme="violeta"]{--acc:#7c3aed;--ok:#8b5cf6;--run:#7c3aed}html[data-theme="verde"]{--acc:#16a34a;--ok:#059669;--run:#16a34a}html[data-theme="rosa"]{--acc:#db2777;--ok:#be185d;--run:#db2777}html[data-theme="grafite"]{--acc:#64748b;--ok:#0d9488;--run:#64748b}
.theme-colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme-colors button{border:2px solid var(--line);border-radius:12px;background:var(--sf);color:var(--tx);min-height:52px;font-weight:700}.theme-colors button.sel{border-color:var(--acc)}
.panel{max-width:560px;margin:0 auto;padding:14px 14px 130px}.panel .card{display:block}.panel h2{margin:6px 0 14px}.summary-line{font-size:13px;color:var(--mut);line-height:1.5;margin:7px 0}
.card .summary-line{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;overflow-wrap:anywhere;margin:5px 0 9px;font-size:13px;line-height:1.4}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.stat{padding:13px;background:var(--sf);border-radius:14px}.stat strong{display:block;font-size:23px;color:var(--acc)}.stat small{color:var(--mut)}
.panel input,.panel select{max-width:100%}.panel .mi{border-radius:12px;padding:5px 10px;margin:7px 0;background:var(--sf)}.panel .btn{margin:5px}.panel .formline{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.panel label{font-size:13px;color:var(--mut)}
#pMetrics{font-size:14px;font-weight:700;color:#cbd5e1}#resumeBox{background:var(--sf);border-radius:14px;margin-bottom:12px;padding:12px;display:none}
@media(max-width:420px){.theme-colors{grid-template-columns:repeat(2,1fr)}}

/* painel de evolução e controles da esteira */
.chartbox{background:var(--sf);padding:12px;border-radius:14px;margin:12px 0;border:1px solid var(--line)}
.chartbox svg{display:block;width:100%;height:auto}.chartbox h3{margin:0 0 8px;font-size:15px}.chartbox text{fill:var(--mut);font-size:11px}
.speedchange{display:flex;gap:9px;justify-content:center;align-items:center;color:#fff;margin:8px 0}
.speedchange button{border:1px solid #64748b;background:#334155;color:#fff;border-radius:9px;font-size:20px;min-width:54px;min-height:43px}
.speedchange strong{font-size:14px}.panel .card{display:block}.panel .card .btn{margin:4px 3px 4px 0}

/* foto pós-treino */
#photoModal{background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:16px}
.photo-sheet{width:min(100%,560px);background:var(--sf);color:var(--tx);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.photo-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.photo-head h3{flex:1;margin:0;font-size:18px}
.photo-stage{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
#camVideo,#photoCanvas{width:100%;height:100%;object-fit:cover;display:block}.mirror{transform:scaleX(-1)}
.photo-note{font-size:13px;color:var(--mut);line-height:1.45;margin:8px 2px 0}
.photo-actions,.photo-secondary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photo-actions .btn,.photo-secondary .btn{flex:1}
.photo-chip{display:inline-block;background:var(--bg);color:var(--mut);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-top:8px}

</style>
</head>
<body>
<header class="appbar"><div class="abi">
  <div class="ab-top"><h1>Corrida</h1><div class="progress" id="prog"></div><button class="icon" onclick="openMenu()" aria-label="Menu">⋯</button></div>
  <div id="weeks" class="chips"></div>
</div></header>
<div class="container">
  <div id="resumeBox"></div><div id="list"></div>
</div>

<button class="fab" onclick="openEditor(null)" aria-label="Novo treino">＋</button>
<div id="toast"></div>
<div id="doneM" class="modal" onclick="if(event.target===this)closeDone()"><div class="bsheet"><div class="grab"></div><h3>Semanas concluídas</h3><div id="doneList"></div></div></div>
<div id="menu" class="modal" onclick="if(event.target===this)closeMenu()"><div class="bsheet"><div class="grab"></div>
  <button class="mi" id="mInst" style="display:none" onclick="mdo(instalar)">📲 Instalar app</button>
  <button class="mi" onclick="mdo(()=>showPanel('stats'))">📊 Histórico e estatísticas</button>
  <button class="mi" onclick="mdo(()=>showPanel('plans'))">🗂️ Meus planos</button>
  <button class="mi" onclick="mdo(()=>showPanel('settings'))">🎨 Temas e ajustes</button>
  <button class="mi" onclick="mdo(()=>showPanel('backup'))">🛡️ Backup e restauração</button>
  <button class="mi" id="mDone" onclick="mdo(openDone)">✅ Semanas concluídas</button>
  <button class="mi" onclick="mdo(setWeeks)">🗓️ Definir nº de semanas</button>
  <button class="mi" onclick="mdo(dupWeek)">⧉ Duplicar semana</button>
  <button class="mi" onclick="mdo(exportPlan)">⬇️ Exportar plano</button>
  <button class="mi" onclick="mdo(()=>document.getElementById('imp').click())">⬆️ Importar plano</button>
  <button class="mi d" onclick="mdo(delWeek)">🗑 Excluir semana</button>
  <button class="mi d" onclick="mdo(clearAll)">⚠️ Limpar tudo</button>
  <input type="file" id="imp" accept=".json" hidden onchange="importPlan(this)">
</div></div>
<div id="extraPanel" class="modal" style="background:var(--bg);overflow:auto;align-items:flex-start"><div id="panelContent" class="panel" style="width:100%"></div></div>
<!-- EDITOR -->
<div id="editor" class="modal"><div class="sheet" id="sheet"></div></div>

<!-- PLAYER -->
<div id="playerModal" class="modal">
  <div class="ph"><span id="pTitle" style="font-weight:bold;font-size:14px;color:#94a3b8"></span><button class="btn-close" onclick="closePlayer()">✕ Sair</button></div>
  <div><div id="pBadge" class="badge bg-walk"></div><div id="pStep" style="font-size:13px;color:#94a3b8;margin-top:4px"></div></div>
  <div class="ringwrap"><svg class="ring" viewBox="0 0 200 200"><circle class="r0" cx="100" cy="100" r="90"/><circle id="pRing" class="r1" cx="100" cy="100" r="90"/></svg><div class="rc"><div id="pTimer" class="timer">00:00</div><div id="pSpeed" class="speed">-</div></div></div>
  <div class="speedchange"><button onclick="changeLiveSpeed(-.1)" aria-label="Diminuir velocidade">−</button><strong>Velocidade da etapa</strong><button onclick="changeLiveSpeed(.1)" aria-label="Aumentar velocidade">+</button></div>
  <div id="pMetrics"></div><div class="next"><div class="nl">PRÓXIMA ETAPA</div><div id="pNext" style="font-weight:bold">-</div></div>
  <div>
    <div class="bar"><div id="pFill"></div></div>
    <div class="pc">
      <button class="circ" onclick="prevStep()" aria-label="Etapa anterior">⏮</button><button class="circ" onclick="repeatStep()" aria-label="Repetir etapa" title="Repetir etapa">↻</button>
      <button id="pPlay" class="circ play" onclick="togglePlay()">▶</button>
      <button class="circ" onclick="nextStep()">⏭</button>
    </div>
    <label style="font-size:13px;color:#94a3b8;display:block;margin-top:12px"><input type="checkbox" id="audioToggle" checked> Som, voz e vibração</label>
  </div>
</div>


<div id="photoModal" class="modal">
  <div class="photo-sheet">
    <div class="photo-head"><button class="icon" onclick="closePhotoModal()">✕</button><h3>Foto pós-treino</h3></div>
    <div class="photo-stage">
      <video id="camVideo" playsinline autoplay muted></video>
      <canvas id="photoCanvas" style="display:none"></canvas>
    </div>
    <div class="photo-chip" id="photoModeChip">Modo selfie</div>
    <p class="photo-note">Tire uma selfie ou foto e o app vai adicionar automaticamente os detalhes do treino na imagem, pronta para postar.</p>
    <div class="photo-actions" id="photoLiveActions">
      <button class="btn" onclick="switchCamera()">🔄 Trocar câmera</button>
      <button class="btn ok" onclick="captureWorkoutPhoto()">📸 Tirar foto</button>
    </div>
    <div class="photo-secondary" id="photoPreviewActions" style="display:none">
      <button class="btn" onclick="retakeWorkoutPhoto()">↺ Refazer</button>
      <button class="btn" onclick="downloadWorkoutPhoto()">⬇️ Baixar</button>
      <button class="btn ok" onclick="shareWorkoutPhoto()">📤 Compartilhar</button>
    </div>
  </div>
</div>

<script>
// ---------- IndexedDB ----------
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('corrida_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbGet(k){const d=await idb();return new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}
async function dbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}

const uid=()=>Math.random().toString(36).slice(2,9);
const newWeek=()=>({id:uid(),workouts:[]});
let plan={cur:0,weeks:[newWeek()]}, done={};
const save=()=>dbSet('bundle',{plan,done}).catch(()=>alert('Erro ao salvar no IndexedDB.'));
let weights=[];let history=[],activePlanName='Meu plano',savedPlans=[],appSettings={theme:'laranja',voice:true};
let photoStream=null,photoFacing='user',photoEntryId=null,photoBlob=null;
const storeExtra=()=>Promise.all([dbSet('history',history),dbSet('plans',savedPlans),dbSet('activeName',activePlanName),dbSet('settings',appSettings),dbSet('weights',weights)]);
const clone=x=>JSON.parse(JSON.stringify(x));
const rnd=(n,d=1)=>Number.isFinite(n)?n.toFixed(d).replace('.',','):'0';
const kmOf=s=>Math.max(0,(Number(s.kmh)||0)*(Number(s.dur)||0)/3600);
const workoutKm=w=>(w.steps||[]).reduce((t,x)=>t+kmOf(x),0);
const getTheme=()=>document.documentElement.dataset.theme=appSettings.theme;
const rr=(ctx,x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()};
const wrapLines=(ctx,text,maxWidth,maxLines)=>{const words=String(text||'').split(/\s+/).filter(Boolean);const lines=[];let cur='';for(const word of words){const test=cur?cur+' '+word:word;if(ctx.measureText(test).width<=maxWidth)cur=test;else{if(cur)lines.push(cur);cur=word;if(lines.length>=maxLines-1)break;}}if(cur&&lines.length<maxLines)lines.push(cur);if(words.length&&lines.length===maxLines){let i=maxLines-1;while(ctx.measureText(lines[i]+'…').width>maxWidth&&lines[i].includes(' '))lines[i]=lines[i].split(' ').slice(0,-1).join(' ');if(lines[i]&& !lines[i].endsWith('…'))lines[i]+='…';}return lines};
const paceFromEntry=e=>{const km=Number(e?.actualKm??e?.plannedKm)||0;const sec=Number(e?.actualSeconds||e?.plannedSeconds)||0;return km>0&&sec>0?fmtPace(3600*km/sec?3600/(sec/km):0):''};



// ---------- helpers ----------
const DEF={walk:'Caminhada',run:'Corrida',cool:'Desaquecimento'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=s=>{const m=Math.floor(s/60),x=s%60;return x?`${m}min ${String(x).padStart(2,'0')}s`:`${m} min`};
const fmtPace=k=>{const t=Math.round(3600/k);return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`};
const fmtKmh=k=>(+k).toFixed(1).replace('.',',');
const fmtSpeed=s=>{if(!s.kmh)return DEF[s.type]||'-';return s.mode==='pace'?`${fmtPace(s.kmh)} min/km (${fmtKmh(s.kmh)} km/h)`:`${fmtKmh(s.kmh)} km/h (${fmtPace(s.kmh)} min/km)`};
const parseVal=(mode,v)=>{v=String(v||'').trim();if(!v||!mode)return 0;
  if(mode==='kmh'){const k=parseFloat(v.replace(',','.'));return k>0?k:0}
  const m=v.match(/^(\d+)(?::(\d{1,2}))?$/);if(!m)return 0;const t=+m[1]*60+(+(m[2]||0));return t>0?3600/t:0};
const totalSec=w=>(w.steps||[]).reduce((a,s)=>a+(Number(s.dur)||0),0);
const wkKey=(w,wo)=>`${w.id}_${wo.id}`;

// ---------- tela principal ----------
let view=false;
const weekDone=w=>w.workouts.length>0&&w.workouts.every(x=>done[wkKey(w,x)]);
const visWeeks=()=>plan.weeks.map((_,i)=>i).filter(i=>!weekDone(plan.weeks[i]));
const curVisible=()=>view||visWeeks().includes(plan.cur);
function render(){
  const vis=visWeeks(),all=!view&&!vis.length,nd=plan.weeks.length-vis.length;
  if(all)plan.cur=plan.weeks.length-1;else if(!view&&!vis.includes(plan.cur))plan.cur=vis[0];
  document.getElementById('mDone').textContent=`✅ Semanas concluídas (${nd})`;
  const wc=document.getElementById('weeks'),list=document.getElementById('list');
  wc.style.display=view||all?'none':'';
  wc.innerHTML=vis.map(i=>`<button class="chip ${i===plan.cur?'on':''}" onclick="selWeek(${i})">Sem ${i+1}</button>`).join('');
  const on=wc.querySelector('.on');if(on)wc.scrollLeft=on.offsetLeft-wc.clientWidth/2+on.clientWidth/2;
  if(all){renderResume();document.getElementById('prog').textContent='🏆';list.innerHTML='<div class="empty"><div style="font-size:42px">🏆</div>Todas as semanas concluídas!<br>Revise em <b>⋯ › Semanas concluídas</b> ou adicione semanas em <b>Definir nº de semanas</b>.</div>';return}
  const w=plan.weeks[plan.cur];
  let c=0;
  list.innerHTML=w.workouts.length?'':'<div class="empty"><div style="font-size:42px">🏃</div>Nenhum treino nesta semana.<br>Toque em <b>＋</b> para criar um treino.</div>';
  w.workouts.forEach((wo,i)=>{
    const ok=!!done[wkKey(w,wo)];if(ok)c++;
    const d=document.createElement('div');d.className='card'+(ok?' completed':'');
    const run=wo.steps.filter(x=>x.type==='run').reduce((t,x)=>t+x.dur,0);
    d.innerHTML=`<label class="ck"><input type="checkbox" ${ok?'checked':''} onchange="toggleDone(${i},this.checked)"><span></span></label>
      <div class="det" onclick="openEditor(${i})"><h3>${esc(wo.title)}</h3><p class="summary-line">${esc(intervalSummary(wo))}</p><div class="pills"><span class="tag">⏱ ${fmtT(totalSec(wo))}</span><span class="tag">🏃 ${fmtT(run)}</span><span class="tag">≈ ${rnd(workoutKm(wo),2)} km</span><span class="tag">${wo.steps.length} etapas</span></div></div>
      <button class="play" onclick="startWorkout(${i})" aria-label="Iniciar">▶</button>
      <div class="tl">${wo.steps.map(x=>`<i class="t-${x.type}" style="flex:${x.dur}"></i>`).join('')}</div>`;
    list.appendChild(d);
  });
  document.getElementById('prog').textContent=`${c}/${w.workouts.length} concluídos`;renderResume();
  if(view){const bn=document.createElement('div');bn.className='vbar';bn.innerHTML=`<span>👁 Semana ${plan.cur+1}${weekDone(w)?' · concluída':''}</span><button class="btn" onclick="exitView()">Voltar ao plano</button>`;list.prepend(bn)}
}
function exitView(){view=false;render()}
function openDone(){
  const rows=plan.weeks.map((w,i)=>weekDone(w)?`<button class="mi" onclick="viewWeek(${i})">Semana ${i+1}<span style="margin-left:auto;color:var(--mut);font-size:13px">${w.workouts.length} treinos ›</span></button>`:'').join('');
  if(!rows)return toast('Nenhuma semana concluída ainda.');
  document.getElementById('doneList').innerHTML=rows;document.getElementById('doneM').classList.add('active');
}
const closeDone=()=>document.getElementById('doneM').classList.remove('active');
function viewWeek(i){closeDone();view=true;plan.cur=i;render();window.scrollTo(0,0)}
let tt=null;
function toast(msg,undo){
  const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="tu">Desfazer</button>':''}`;
  if(undo)document.getElementById('tu').onclick=()=>{undo();t.classList.remove('on')};
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),6000);
}
function afterDone(w,k){if(weekDone(w))toast(`🎉 Semana ${plan.weeks.indexOf(w)+1} concluída! Ela foi para ⋯ › Semanas concluídas.`,()=>{delete done[k];plan.cur=plan.weeks.indexOf(w);save();render()})}
function selWeek(i){plan.cur=i;save();render()}
function toggleDone(i,v){const w=plan.weeks[plan.cur],k=wkKey(w,w.workouts[i]);v?done[k]=true:delete done[k];save();render();if(v&&!view)afterDone(w,k)}
function delWorkout(i){if(!confirm('Excluir este treino?'))return;plan.weeks[plan.cur].workouts.splice(i,1);save();render()}
function dupWorkout(i){const w=plan.weeks[plan.cur],c=JSON.parse(JSON.stringify(w.workouts[i]));c.id=uid();c.title+=' (cópia)';w.workouts.splice(i+1,0,c);save();render()}

// ---------- semanas ----------
function setWeeks(){
  const n=parseInt(prompt('Quantas semanas terá o plano?',plan.weeks.length),10);
  if(!n||n<1||n>104)return;
  if(n<plan.weeks.length&&!confirm(`Isso exclui as semanas ${n+1} a ${plan.weeks.length} com seus treinos. Continuar?`))return;
  while(plan.weeks.length<n)plan.weeks.push(newWeek());
  plan.weeks.length=n;plan.cur=Math.min(plan.cur,n-1);save();render();
}
function dupWeek(){
  if(!curVisible())return alert('Abra a semana em ⋯ › Semanas concluídas para fazer isso.');
  const c=JSON.parse(JSON.stringify(plan.weeks[plan.cur]));c.id=uid();c.workouts.forEach(w=>w.id=uid());
  plan.weeks.splice(plan.cur+1,0,c);plan.cur++;save();render();
}
function delWeek(){
  if(!curVisible())return alert('Abra a semana em ⋯ › Semanas concluídas para fazer isso.');
  if(plan.weeks.length<2)return alert('O plano precisa ter ao menos 1 semana. Use "Limpar tudo" para recomeçar.');
  if(!confirm('Excluir a semana atual e seus treinos?'))return;
  plan.weeks.splice(plan.cur,1);plan.cur=Math.min(plan.cur,plan.weeks.length-1);view=false;save();render();
}
function clearAll(){
  if(!confirm('Apagar TODAS as semanas, treinos e o progresso? Não dá para desfazer.'))return;
  plan={cur:0,weeks:[newWeek()]};done={};view=false;save();render();
}
function exportPlan(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({plan,done})],{type:'application/json'}));
  a.download='plano-corrida.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function validPack(d){
 if(!d||!d.plan||!Array.isArray(d.plan.weeks)||!d.plan.weeks.length||d.plan.weeks.length>104)throw Error('Semanas inválidas');
 let ids=new Set();
 for(const w of d.plan.weeks){if(!w||typeof w.id!=='string'||ids.has(w.id)||!Array.isArray(w.workouts)||w.workouts.length>200)throw Error('Semana inválida');ids.add(w.id);
 for(const wo of w.workouts){if(!wo||typeof wo.id!=='string'||!Array.isArray(wo.steps)||!wo.steps.length||wo.steps.length>3000)throw Error('Treino inválido');
 for(const x of wo.steps){if(!['run','walk','cool'].includes(x.type)||!Number.isFinite(x.dur)||x.dur<=0||x.dur>86400||!Number.isFinite(x.kmh)||x.kmh<0||x.kmh>40||typeof x.name!=='string')throw Error('Etapa inválida');}}
 }return true;
}
function importPlan(inp){
 const f=inp.files[0];if(!f)return;
 f.text().then(t=>{const d=JSON.parse(t);validPack(d);if(!confirm('Importar este plano? O plano atual será guardado em Meus planos.'))return;
 savedPlans.push({id:uid(),name:activePlanName,plan:clone(plan),done:clone(done)});
 plan=d.plan;done=d.done||{};activePlanName=f.name.replace(/\.json$/i,'');plan.cur=0;view=false;storeExtra();save();render();toast('Plano importado. O anterior está em Meus planos.')}).catch(e=>alert('Arquivo inválido: '+e.message));inp.value='';
}

// ---------- editor de treino ----------
let ed=null;
const NM={walk:'CAMINHADA',run:'CORRIDA',cool:'DESAQUECIMENTO'},DK={walk:5,run:10,cool:5};
const TL={walk:'🚶 Caminhar',run:'🏃 Correr',cool:'❄️ Desaquec.'};
const mk=(t,dur,name)=>({k:'s',name:name||NM[t],type:t,dur,kmh:DK[t]});
const fmtMS=x=>`${Math.floor(x/60)}:${String(x%60).padStart(2,'0')}`;
const spVal=(s,u)=>!s.kmh?'':u==='pace'?fmtPace(s.kmh):(+s.kmh).toFixed(1).replace('.',',');
const spEq=(s,u)=>!s.kmh?'sem ritmo':u==='pace'?fmtKmh(s.kmh)+' km/h':fmtPace(s.kmh)+' min/km';
const eS=(i,j)=>j<0?ed.data.items[i]:ed.data.items[i].steps[j];
const eAR=(i,j)=>j<0?ed.data.items:ed.data.items[i].steps;
const eId=(p,i,j)=>document.getElementById(p+i+'_'+j);
const flat=d=>d.items.flatMap(it=>it.k==='s'?[{...it}]:Array.from({length:it.n},(_,r)=>it.steps.map(s=>({...s,name:`${s.name} (${r+1}/${it.n})`}))).flat());

function openEditor(i){
  const w=plan.weeks[plan.cur];let d;
  if(i===null)d={id:uid(),title:`Treino ${w.workouts.length+1}`,notes:'',unit:'kmh',items:[mk('walk',300,'AQUECIMENTO'),{k:'r',n:5,steps:[mk('run',180),mk('walk',120,'RECUPERAÇÃO')]},mk('cool',300,'DESAQUECIMENTO')]};
  else{
    d=JSON.parse(JSON.stringify(w.workouts[i]));
    if(!d.items){d.unit=(d.steps.find(x=>x.mode)||{}).mode||'kmh';d.items=d.steps.map(x=>({k:'s',name:x.name,type:x.type,dur:x.dur,kmh:x.kmh||0,distanceKm:x.distanceKm||0}))}
  }
  ed={idx:i,data:d};renderEditor();document.getElementById('editor').classList.add('active');
}
function closeEditor(){document.getElementById('editor').classList.remove('active');ed=null}
const ibtn=(i,j)=>`<button onclick="eMv(${i},${j},-1)">↑</button><button onclick="eMv(${i},${j},1)">↓</button><button onclick="eCp(${i},${j})">⧉</button><button onclick="eRm(${i},${j})">✕</button>`;
function stepCard(s,i,j){
  const u=ed.data.unit;
  return `<div class="sc sc-${s.type}"><div class="sc-h"><input class="sn" value="${esc(s.name)}" oninput="eS(${i},${j}).name=this.value"><span class="ib">${ibtn(i,j)}</span></div>
  <div class="seg">${['walk','run','cool'].map(t=>`<button class="${s.type===t?'on '+t:''}" onclick="eType(${i},${j},'${t}')">${TL[t]}</button>`).join('')}</div>
  <div class="ctl">
    <div class="cg"><label>Duração (min:seg)</label><div class="stp"><button onclick="eDur(${i},${j},-1)">−</button><input id="d${i}_${j}" value="${fmtMS(s.dur)}" onchange="eDurT(${i},${j},this)"><button onclick="eDur(${i},${j},1)">+</button></div><small>toque para digitar</small></div>
    <div class="cg"><label>Ritmo (${u==='kmh'?'km/h':'min/km'})</label><div class="stp"><button onclick="eSp(${i},${j},-1)">−</button><input id="p${i}_${j}" ${u==='kmh'?'inputmode="decimal"':''} placeholder="—" value="${spVal(s,u)}" onchange="eSpT(${i},${j},this)"><button onclick="eSp(${i},${j},1)">+</button></div><small id="q${i}_${j}">${spEq(s,u)}</small></div>
   </div><div class="cg" style="grid-column:1/-1"><label>Distância planejada (km) · opcional</label><div class="stp"><input inputmode="decimal" placeholder="Ex.: 0,4" value="${s.distanceKm?rnd(s.distanceKm,3):''}" onchange="eDistance(${i},${j},this)"></div><small>Se informar distância e tempo, a velocidade/pace será calculada automaticamente.</small></div></div>`;
}

function renderEditor(){
  const d=ed.data,u=d.unit;
  const items=d.items.map((it,i)=>it.k==='s'?stepCard(it,i,-1):`<div class="rep"><div class="rep-h"><b>🔁 Repetir</b><div class="stp sm"><button onclick="eN(${i},-1)">−</button><span id="n${i}">${it.n}×</span><button onclick="eN(${i},1)">+</button></div><span class="ib">${ibtn(i,-1)}</span></div>${it.steps.map((x,j)=>stepCard(x,i,j)).join('')}<button class="btn" style="width:100%" onclick="eAddIn(${i})">+ Etapa no bloco</button></div>`).join('');
  document.getElementById('sheet').innerHTML=`

function intervalSummary(wo){
 const steps=Array.isArray(wo.steps)?wo.steps:[];
 if(!steps.length)return 'Nenhuma etapa';
 const same=(a,b)=>a.type===b.type && a.dur===b.dur && Math.abs((Number(a.kmh)||0)-(Number(b.kmh)||0))<0.02 && Math.abs((Number(a.distanceKm)||0)-(Number(b.distanceKm)||0))<0.001;
 const duration=seconds=>{const m=Math.floor(seconds/60),r=seconds%60;return r?`${m}:${String(r).padStart(2,'0')}`:`${m}min`};
 const detail=x=>`${duration(x.dur)}${x.kmh?' a '+fmtKmh(x.kmh):''}`;
 const title=x=>{const n=String(x.name||'').toLowerCase();return /aquec/.test(n)?'Aquecimento':/desaquec|soltura/.test(n)||x.type==='cool'?'Desaquecimento':/recuper|descanso/.test(n)?'Recuperação':x.type==='walk'?'Caminhada':'Corrida'};
 const result=[];
 for(let i=0;i<steps.length;){
   let best=null;
   // Encontra blocos repetidos consecutivamente, inclusive A/B/A/B/A/B.
   for(let len=1;len<=Math.min(6,Math.floor((steps.length-i)/2));len++){
     let reps=1;
     while(i+(reps+1)*len<=steps.length&&steps.slice(i,i+len).every((x,k)=>same(x,steps[i+reps*len+k])))reps++;
     if(reps>=2&&(!best||reps*len>best.covered||(reps*len===best.covered&&len<best.len)))best={len,reps,covered:reps*len};
   }
   if(best){
     const items=steps.slice(i,i+best.len);
     const txt=items.map(x=>detail(x)).join(' + ');
     result.push(`${best.reps}× (${txt}) km/h`);
     i+=best.covered;
   }else{
     const x=steps[i];const label=(i===steps.length-1&&i>0&&x.dur<=600&&((x.kmh||0)<(steps[i-1].kmh||0)||x.type==='cool'))?'Desaquecimento':title(x);result.push(`${label} ${detail(x)}${x.kmh?' km/h':''}`);i++;
   }
 }
 return result.join(' · ');
}

 if(which==='settings'){
 html+='<p>Escolha a cor principal do aplicativo:</p><div class="theme-colors">'+[['laranja','🟠 Laranja'],['oceano','🔵 Oceano'],['violeta','🟣 Violeta'],['verde','🟢 Verde'],['rosa','🌸 Rosa'],['grafite','⚫ Grafite']].map(([id,name])=>`<button class="${appSettings.theme===id?'sel':''}" onclick="setTheme('${id}')">${name}</button>`).join('')+'</div><p class="summary-line">Os temas respeitam o modo claro ou escuro do dispositivo.</p>';
 html+='<h3>Avisos por voz</h3><div class="card">'+[['stage','Anunciar início da etapa'],['speed','Informar velocidade ou pace'],['duration','Informar duração da etapa'],['countdown','Avisar 5 segundos antes da mudança'],['finish','Anunciar conclusão']].map(([key,label])=>`<label style="display:block;padding:9px"><input type="checkbox" ${voiceEnabled(key)?'checked':''} onchange="setVoiceOption('${key}',this.checked)"> ${label}</label>`).join('')+`<div class="formline"><label>Velocidade da fala<select onchange="setVoiceParam('voiceRate',this.value)">${[.8,1,1.1,1.25,1.5].map(v=>`<option value="${v}" ${Number(appSettings.voiceRate||1.1)===v?'selected':''}>${v}×</option>`).join('')}</select></label><label>Volume<select onchange="setVoiceParam('voiceVolume',this.value)">${[.25,.5,.75,1].map(v=>`<option value="${v}" ${Number(appSettings.voiceVolume??1)===v?'selected':''}>${Math.round(v*100)}%</option>`).join('')}</select></label></div><button class="btn" onclick="testVoice()">🔊 Testar voz</button></div>`;
 }
 if(which==='backup'){
 html+=`<div class="card"><b>Backup completo</b><p>Inclui plano ativo, outros planos, progresso, histórico e tema. Use para trocar de dispositivo.</p><button class="btn ok" onclick="exportBackup()">⬇️ Exportar backup completo</button><button class="btn" onclick="document.getElementById('backupInput').click()">⬆️ Restaurar backup</button><input id="backupInput" type="file" accept=".json,application/json" hidden onchange="restoreBackup(this)"></div><div class="card"><b>Importar plano separado</b><p>Use o menu principal para importar planos JSON antigos. O plano atual será preservado em Meus planos.</p></div>`;
 }
 document.getElementById('panelContent').innerHTML=html;document.getElementById('extraPanel').classList.add('active');}
function editHistory(i){const x=history[i],v=prompt('Distância REAL indicada na esteira (km):',x.actualKm??'');if(v===null)return;const n=Number(v.replace(',','.'));if(!Number.isFinite(n)||n<0||n>200)return alert('Distância inválida');x.actualKm=n;storeExtra();showPanel('stats')}
function setTheme(t){appSettings.theme=t;getTheme();storeExtra();showPanel('settings')}
function saveCurrentAsPlan(){const name=prompt('Nome da cópia do plano:',activePlanName);if(!name?.trim())return;savedPlans.push({id:uid(),name:name.trim(),plan:clone(plan),done:clone(done)});storeExtra();showPanel('plans')}
function renameCurrentPlan(){const name=prompt('Nome do plano atual:',activePlanName);if(!name?.trim())return;activePlanName=name.trim();storeExtra();showPanel('plans')}
function activatePlan(i){if(!confirm('Trocar para este plano? O atual ficará salvo automaticamente.'))return;const x=savedPlans.splice(i,1)[0];savedPlans.push({id:uid(),name:activePlanName,plan:clone(plan),done:clone(done)});plan=clone(x.plan);done=clone(x.done);activePlanName=x.name;plan.cur=0;view=false;save();storeExtra();closePanel()}
function deleteSavedPlan(i){if(!confirm('Excluir esta cópia do plano?'))return;savedPlans.splice(i,1);storeExtra();showPanel('plans')}
function downloadJson(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){downloadJson({backupVersion:1,createdAt:new Date().toISOString(),plan,done,history,savedPlans,activePlanName,appSettings,weights},'corrida-backup-completo.json')}
async function restoreBackup(el){const f=el.files[0];if(!f)return;try{const d=JSON.parse(await f.text());validPack(d);if(!Array.isArray(d.history)||!Array.isArray(d.savedPlans))throw Error('Backup incompleto');for(const x of d.savedPlans)validPack({plan:x.plan});if(!confirm('Restaurar backup completo? Isso substituirá seus dados atuais. Exporte um backup antes de continuar.'))return;
 plan=d.plan;done=d.done||{};history=d.history;savedPlans=d.savedPlans;activePlanName=d.activePlanName||'Meu plano';appSettings=d.appSettings||{theme:'laranja'};weights=Array.isArray(d.weights)?d.weights:[];getTheme();await save();await storeExtra();closePanel();toast('Backup restaurado.')}catch(e){alert('Falha ao restaurar: '+e.message)}finally{el.value=''}}
// ---------- novos recursos v7 ----------
function setVoiceOption(k,v){appSettings.voiceOptions??={};appSettings.voiceOptions[k]=v;storeExtra();showPanel('settings')}
function setVoiceParam(k,v){appSettings[k]=Number(v);storeExtra();showPanel('settings')}
function testVoice(){if(!('speechSynthesis' in window))return alert('Voz não disponível neste navegador');speechSynthesis.cancel();const m=new SpeechSynthesisUtterance('Próxima etapa: corrida. Velocidade, nove quilômetros por hora. Duração, três minutos.');m.lang='pt-BR';m.rate=appSettings.voiceRate||1.1;m.volume=appSettings.voiceVolume??1;speechSynthesis.speak(m)}
function setRpe(i){const x=history[i],v=prompt('Esforço percebido de 1 a 10 (1 muito leve, 10 máximo):',x.rpe??'5');if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<1||n>10)return alert('Digite um número inteiro entre 1 e 10');x.rpe=n;storeExtra();showPanel('stats')}
function collectWorkoutFeedback(id){const i=history.findIndex(x=>x.id===id);if(i<0)return;const r=prompt('Como foi o esforço do treino? Informe 1 a 10 (Cancelar para pular):','5');if(r!==null){const n=Number(r);if(Number.isInteger(n)&&n>=1&&n<=10)history[i].rpe=n}const d=prompt('Distância real indicada na esteira, em km (opcional):','');if(d!==null&&d.trim()){const n=Number(d.replace(',','.'));if(Number.isFinite(n)&&n>=0&&n<=200)history[i].actualKm=n}storeExtra();setTimeout(()=>{if(confirm('Deseja tirar uma foto ou selfie com os detalhes do treino para postar?'))openWorkoutPhoto(id)},80)}
function exportSinglePlan(i){const x=i===-1?{name:activePlanName,plan,done}:savedPlans[i];if(!x)return;const safe=x.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').slice(0,50)||'plano';downloadJson({plan:x.plan,done:x.done||{}},'corrida-'+safe+'.json')}
async function importSinglePlan(el){const f=el.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());validPack(d);if(savedPlans.length>=100)throw Error('Limite de 100 planos salvos.');const name=prompt('Nome para este plano importado:',f.name.replace(/\.json$/i,''));if(!name?.trim())return;savedPlans.push({id:uid(),name:name.trim(),plan:d.plan,done:d.done&&typeof d.done==='object'&&!Array.isArray(d.done)?d.done:{}});await storeExtra();showPanel('plans');toast('Plano adicionado à biblioteca.')}catch(e){alert('Erro na importação: '+e.message)}finally{el.value=''}}
function addWeight(){const date=prompt('Data da medição (AAAA-MM-DD):',new Date().toLocaleDateString('en-CA'));if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date)))return alert('Data inválida');const raw=prompt('Peso (kg):','');if(raw===null)return;const kg=Number(raw.replace(',','.'));if(!Number.isFinite(kg)||kg<20||kg>400)return alert('Peso inválido');weights=weights.filter(x=>x.date!==date);weights.push({date,kg});weights.sort((a,b)=>a.date.localeCompare(b.date));storeExtra();showPanel('stats')}
function deleteWeight(i){if(!confirm('Excluir esta medição?'))return;weights.splice(i,1);storeExtra();showPanel('stats')}
function plotSvg(points,label,unit){const width=340,height=158,left=42,right=12,top=14,bottom=29;const vals=points.map(x=>x.value).filter(Number.isFinite);if(!vals.length)return '<p class="summary-line">Sem dados ainda.</p>';let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}else{const pad=(hi-lo)*.15;lo-=pad;hi+=pad}const xs=i=>left+(width-left-right)*(points.length===1?.5:i/(points.length-1));const ys=v=>top+(height-top-bottom)*(hi-v)/(hi-lo);const coords=points.map((p,i)=>[xs(i),ys(p.value)]);const line=coords.map(p=>p.join(',')).join(' ');let svg=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(label)}">`;for(let j=0;j<3;j++){const y=top+j*(height-top-bottom)/2,val=hi-j*(hi-lo)/2;svg+=`<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="var(--line)"/><text x="${left-5}" y="${y+4}" text-anchor="end">${rnd(val,1)}</text>`}svg+=`<polyline points="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`;coords.forEach(([x,y])=>svg+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--acc)"/>`);const step=Math.max(1,Math.ceil(points.length/5));points.forEach((p,i)=>{if(i%step===0||i===points.length-1)svg+=`<text x="${xs(i)}" y="${height-8}" text-anchor="middle">${esc(p.label)}</text>`});return svg+'</svg><p class="summary-line">'+esc(label)+' ('+esc(unit)+')</p>'}
function renderEvolutionCharts(){const sorted=[...history].sort((a,b)=>String(a.at).localeCompare(String(b.at)));const distance=sorted.map(x=>({label:new Date(x.at).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),value:Number(x.actualKm??x.plannedKm)||0}));const pace=sorted.map(x=>{const km=Number(x.actualKm??x.plannedKm)||0;return{label:new Date(x.at).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),value:km>0?(Number(x.actualSeconds)||0)/60/km:NaN}}).filter(x=>Number.isFinite(x.value)&&x.value>0&&x.value<30);const days=new Map();sorted.forEach(x=>{const d=String(x.at).slice(0,10);days.set(d,(days.get(d)||0)+1)});const freq=[...days].map(([date,value])=>({label:date.slice(8)+'/'+date.slice(5,7),value}));return `<div class="chartbox"><h3>Distância por treino</h3>${plotSvg(distance,'Distância registrada ou prevista','km')}</div><div class="chartbox"><h3>Pace médio estimado</h3>${plotSvg(pace,'Ritmo médio','min/km')}</div><div class="chartbox"><h3>Frequência de treinos por dia</h3>${plotSvg(freq,'Treinos concluídos','quantidade')}</div><div class="chartbox"><h3>Histórico de peso (opcional)</h3><button class="btn ok" onclick="addWeight()">+ Registrar peso</button>${plotSvg(weights.map(x=>({label:x.date.slice(8)+'/'+x.date.slice(5,7),value:x.kg})),'Peso corporal','kg')}${weights.map((x,i)=>`<div class="summary-line">${esc(x.date)}: ${rnd(x.kg,1)} kg <button class="btn danger" onclick="deleteWeight(${i})">Excluir</button></div>`).join('')}</div><p class="summary-line">Gráficos exibem dados registrados no dispositivo. Distâncias e paces calculados a partir do plano são estimativas, salvo quando você informa a distância real.</p>`}

function getHistoryById(id){return history.find(x=>x.id===id)||null}
function getWorkoutPhotoData(id){const e=getHistoryById(id);if(!e)return null;const dist=Number(e.actualKm??e.plannedKm)||0;const pace=paceFromEntry(e);return {entry:e,date:new Date(e.at),dist,pace,title:e.title,planName:e.planName||activePlanName,week:e.week,duration:fmtT(e.actualSeconds||e.plannedSeconds||0),rpe:e.rpe}}
async function openWorkoutPhoto(id){if(!navigator.mediaDevices?.getUserMedia)return alert('Câmera não disponível neste navegador.');photoEntryId=id;photoBlob=null;document.getElementById('photoCanvas').style.display='none';const v=document.getElementById('camVideo');v.style.display='block';document.getElementById('photoLiveActions').style.display='flex';document.getElementById('photoPreviewActions').style.display='none';document.getElementById('photoModal').classList.add('active');await startPhotoCamera()}
function closePhotoModal(){stopPhotoStream();document.getElementById('photoModal').classList.remove('active');photoEntryId=null;photoBlob=null}
function stopPhotoStream(){if(photoStream){photoStream.getTracks().forEach(t=>t.stop());photoStream=null}}
async function startPhotoCamera(){stopPhotoStream();try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:photoFacing},width:{ideal:1440},height:{ideal:1920}},audio:false});photoStream=s;const v=document.getElementById('camVideo');v.srcObject=s;v.classList.toggle('mirror',photoFacing==='user');document.getElementById('photoModeChip').textContent=photoFacing==='user'?'Modo selfie':'Modo câmera traseira';await v.play()}catch(e){alert('Não foi possível acessar a câmera. Verifique a permissão do navegador.');closePhotoModal()}}
async function switchCamera(){photoFacing=photoFacing==='user'?'environment':'user';await startPhotoCamera()}
function drawWorkoutOverlay(ctx,w,h,data){const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#d35400';const panelH=Math.max(h*.28,240);const y=h-panelH;const grad=ctx.createLinearGradient(0,y,0,h);grad.addColorStop(0,'rgba(0,0,0,0.05)');grad.addColorStop(.18,'rgba(0,0,0,.45)');grad.addColorStop(1,'rgba(0,0,0,.82)');ctx.fillStyle=grad;ctx.fillRect(0,y,w,panelH);ctx.save();rr(ctx,24,24,190,44,22);ctx.fillStyle=acc;ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textBaseline='middle';ctx.fillText('TREINO CONCLUÍDO',42,46);ctx.restore();ctx.fillStyle='#fff';ctx.textBaseline='top';ctx.font='bold 42px sans-serif';const lines=wrapLines(ctx,(data.title||'Treino').toUpperCase(),w-60,2);let ty=y+28;for(const line of lines){ctx.fillText(line,30,ty);ty+=46}ctx.font='24px sans-serif';ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillText(`${data.planName||'Plano'} · Semana ${data.week||'-'}`,30,ty+6);ty+=44;ctx.font='bold 27px sans-serif';ctx.fillStyle=acc;ctx.fillText(`${data.duration}  ·  ${String((data.dist||0).toFixed(2)).replace('.',',')} km`,30,ty);ty+=38;ctx.font='22px sans-serif';ctx.fillStyle='#fff';const dateTxt=data.date?data.date.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';let foot=`${dateTxt}`;if(data.pace)foot+=`  ·  Pace ${data.pace} min/km`;if(data.rpe)foot+=`  ·  RPE ${data.rpe}/10`;ctx.fillText(foot,30,ty)}
function captureWorkoutPhoto(){const v=document.getElementById('camVideo');if(!v.videoWidth)return;const c=document.getElementById('photoCanvas'),ctx=c.getContext('2d');const w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;if(photoFacing==='user'){ctx.save();ctx.scale(-1,1);ctx.drawImage(v,-w,0,w,h);ctx.restore()}else ctx.drawImage(v,0,0,w,h);const data=getWorkoutPhotoData(photoEntryId);if(data)drawWorkoutOverlay(ctx,w,h,data);c.style.display='block';v.style.display='none';document.getElementById('photoLiveActions').style.display='none';document.getElementById('photoPreviewActions').style.display='flex';c.toBlob(b=>photoBlob=b,'image/png',.96);stopPhotoStream()}
async function retakeWorkoutPhoto(){photoBlob=null;document.getElementById('photoCanvas').style.display='none';const v=document.getElementById('camVideo');v.style.display='block';document.getElementById('photoLiveActions').style.display='flex';document.getElementById('photoPreviewActions').style.display='none';await startPhotoCamera()}
function downloadWorkoutPhoto(){const c=document.getElementById('photoCanvas');const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='corrida-post-treino.png';a.click()}
async function shareWorkoutPhoto(){const c=document.getElementById('photoCanvas');const blob=photoBlob||await new Promise(res=>c.toBlob(res,'image/png',.96));if(!blob)return;const file=new File([blob],'corrida-post-treino.png',{type:'image/png'});const data=getWorkoutPhotoData(photoEntryId)||{};const text=`${data.title||'Treino concluído'} · ${data.duration||''} · ${String((data.dist||0).toFixed(2)).replace('.',',')} km`;try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Treino concluído',text});}else{downloadWorkoutPhoto();toast('Imagem pronta. O navegador baixou a foto.')} }catch(e){}}

// ---------- init ----------
(async()=>{
  try{
    const b=await dbGet('bundle'),p=b?.plan||await dbGet('plan'),d=b?.done||await dbGet('done');
    if(p&&Array.isArray(p.weeks)&&p.weeks.length){plan=p;plan.cur=Math.min(plan.cur||0,plan.weeks.length-1)}
    if(d)done=d;history=await dbGet('history')||[];savedPlans=await dbGet('plans')||[];activePlanName=await dbGet('activeName')||'Meu plano';appSettings=await dbGet('settings')||{theme:'laranja'};weights=await dbGet('weights')||[];getTheme();
  }catch(e){}
  render();
})();
</script>
